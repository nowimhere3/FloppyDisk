# Phase 0 is manual-only: the workflow orchestrates the frozen Python pipeline.
name: Extract image links

on:
  workflow_dispatch:
    inputs:
      targets_b64:
        description: Base64-encoded UTF-8 target text
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize submitted targets
        env:
          TARGETS_B64: ${{ inputs.targets_b64 }}
        run: printf '%s' "$TARGETS_B64" | base64 -d > targets.txt

      # Keep the verified discovery engine exact and external to FloppyDisk.
      - name: Install pinned gallery-dl
        run: python -m pip install gallery-dl==1.32.10

      - name: Record gallery-dl version
        run: gallery-dl --version

      - name: Run frozen FloppyDisk pipeline
        run: >-
          python -m floppydisk
          --targets targets.txt
          --out links.txt
          --diagnostics diagnostics.txt

      # Preserve generated evidence even when an earlier workflow step fails.
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floppydisk-results
          path: |
            links.txt
            diagnostics.txt
          if-no-files-found: warn
          retention-days: 1

